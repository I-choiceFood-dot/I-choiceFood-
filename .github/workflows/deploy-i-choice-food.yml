name: Deploy i-choice food to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set GitHub Pages base path
        id: site-base
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repository_name" = "$owner.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${repository_name}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static website
        run: pnpm --filter @workspace/i-choice-food build
        env:
          BASE_PATH: ${{ steps.site-base.outputs.value }}
          PORT: 19011

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/i-choice-food/dist/public

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
